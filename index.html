<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive Photo Gallery</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body onload="addTabFocus()">
  <h1>Interactive Photo Gallery</h1>

  <div id="image">
  <span id="image-text">
    Hover or focus on an image below to display here.
  </span>
</div>

  <div class="gallery">
    <img class="preview" src="img/GoldenRetriever.jpg" alt="Golden retriever running through snow">
    <img class="preview" src="img/frozenLake.jpg" alt="Sunset over a frozen lake">
    <img class="preview" src="img/citynightlights.jpg" alt="City skyline at night with lights">
    <img class="preview" src="img/pinkflowers.jpg" alt="Close-up of pink flowers in spring">
    <img class="preview" src="img/bridge.jpg" alt="Mountain and a bridge">
    <img class="preview" src="img/coffee.jpg" alt="Cozy coffee mug on a table">
  </div>

  <script src="js/script.js"></script>
</body>
</html>
